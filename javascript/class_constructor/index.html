// 1 class can have max to max 1 constructor


class Shape{

    constructor(name){
        this.name = name
    }
    area(){
        return 0;
    }
}

class Circle extends Shape{
    constructor(radius){
        super("Circle")
        this.radius = radius;
    }

    area(){
        return Math.PI * this.radius * this.radius
    }
}

class Square extends Shape{
    constructor(side){
        super("Square")
        this.side = side
    }

    area(){
        return this.side ** 2
    }
}

const circle1 = new Circle(5)
const square1 = new Circle(5)
